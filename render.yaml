# Render Blueprint Specification
# AI-Driven Smart Healthcare Data Exchange and Analytics Ecosystem
# See Render Blueprint docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: smarthealthcare-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: ai_smart_healthcare
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: "https://smarthealthcare-frontend.onrender.com,http://localhost:5173"

  # -------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: static
    name: smarthealthcare-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smarthealthcare-api-6ebh.onrender.com
