databases:
  - name: smarthealthcare-db
    databaseName: smarthealthcare
    user: smarthealthcare
    region: singapore
    plan: free

services:
  - type: web
    name: smarthealthcare-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@smarthealthcare.local
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: DEMO_PATIENT_EMAIL
        value: patient.demo@smarthealthcare.local
      - key: DEMO_PATIENT_PASSWORD
        generateValue: true
      - key: DEMO_DOCTOR_EMAIL
        value: doctor.demo@smarthealthcare.local
      - key: DEMO_DOCTOR_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_EMAIL
        value: admin.demo@smarthealthcare.local
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://smarthealthcare-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: smarthealthcare-db
          property: connectionString

  - type: web
    name: smarthealthcare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_BASE_URL
        value: https://smarthealthcare-api-6ebh.onrender.com
